    <main id="contenido" class="contenido">
        <section class="tarjeta formulario-angosto" aria-labelledby="titulo-login">
            <h1 id="titulo-login">Iniciar sesión</h1>
            <form action="#" method="post" class="formulario">
                <p class="campo">
                    <label for="usuario">Usuario</label>
                    <input id="usuario" name="usuario" type="text" autocomplete="username" required>
                </p>
                <p class="campo">
                    <label for="clave">Contraseña</label>
                    <input id="clave" name="clave" type="password" autocomplete="current-password" required>
                </p>
                <p class="mensaje-error" id="error-login" hidden>Usuario o contraseña incorrectos.</p>
                <p class="btn-login"><button type="submit" class="btn-primario">Ingresar</button></p>
            </form>
        </section>
    </main>
    <footer class="pie">
        <p>Centro Agroforestal y Acuícola Arapaima - SENA Regional Putumayo</p>
